id: project-scales
version: 6.0.0
schema: skill-pack/v1
category: engineering-intelligence
description: >
  Detects and adapts to project scale — TINY, SMALL, MEDIUM, LARGE, ENTERPRISE — based on LOC, modules, team size, and operational complexity. Triggers on: scale, project size, team size, LOC, modules, monorepo, monolith, microservice, headcount, contributor.

compatible_agents:
  - codex
  - opencode
  - cursor
  - gemini-cli
  - claude-code
  - copilot
  - windsurf
  - cline
  - roo-code

priority: normal
cache_tier: domain
intent_triggers:
  - scale
  - project size
  - team size
  - LOC
  - modules
  - monorepo
  - monolith
  - microservice
  - headcount
  - contributor
  - complexity
  - codebase size
allowed_tools:
  - Read
  - Write
  - Edit
  - Grep
  - Glob

integrity:
  algorithm: sha256
  hash: f1ea057615cbde4c7f9552f8525c5e6faa5c5805b66479388a1c5ee569245faf
  signed: false

