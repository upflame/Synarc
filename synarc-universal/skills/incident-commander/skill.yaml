id: incident-commander
version: 6.0.0
schema: skill-pack/v1
category: engineering-intelligence
description: >
  Coordinates incident response — assembles the team, classifies severity, runs comms, drives mitigation, and runs the postmortem. Triggers on: incident, outage, sev1, sev2, sev3, ICS, incident command, on-call, comms, mitigation, postmortem, RCA, status update.

compatible_agents:
  - codex
  - opencode
  - cursor
  - gemini-cli
  - claude-code
  - copilot
  - windsurf
  - cline
  - roo-code

priority: critical
cache_tier: domain
intent_triggers:
  - incident
  - outage
  - sev1
  - sev2
  - sev3
  - ICS
  - incident command
  - on-call
  - comms
  - mitigation
  - postmortem
  - RCA
  - status update
  - escalation
  - customer impact
  - war room
  - bridge
  - status page
  - root cause
allowed_tools:
  - Read
  - Write
  - Edit
  - Grep
  - Glob

integrity:
  algorithm: sha256
  hash: da8b6a582058a2fc63361c9b0dd440b6435806817f478bd01414f59f2d7a4e3d
  signed: false

