id: negative-prompts
version: 6.0.0
schema: skill-pack/v1
category: engineering-intelligence
description: >
  Codifies prohibitions — banned vocabulary, banned patterns, banned assumptions, and the rationale for each. Loaded as a Tier-1 reference for all skills. Triggers on: do not, never, avoid, ban, prohibit, refuse, off-limits, deprecated, banned, forbidden, anti-pattern.

compatible_agents:
  - codex
  - opencode
  - cursor
  - gemini-cli
  - claude-code
  - copilot
  - windsurf
  - cline
  - roo-code

priority: critical
cache_tier: core
intent_triggers:
  - do not
  - never
  - avoid
  - ban
  - prohibit
  - refuse
  - off-limits
  - deprecated
  - banned
  - forbidden
  - anti-pattern
  - stop
  - "don't"
allowed_tools:
  - Read
  - Write
  - Edit
  - Grep
  - Glob

integrity:
  algorithm: sha256
  hash: c783d6da5d4532db965613369f9f5b87ce02973f981a039adbae4beb2f212ad3
  signed: false

