# agent-architect specific guardrails
schema: guardrails/v1
version: 1.0.0

refusal_rules:
  - id: G-ARCH-001
    description: Refuse multi-agent without single-agent justification
    trigger: "multi.agent|multiple.agents).*(without|no).*(rationale|justification|why)"
    response: "Multi-agent adds cost and complexity. Justify each agent or default to single."
    severity: block

  - id: G-ARCH-002
    description: Refuse A2A without auth
    trigger: "a2a|agent.to.agent).*(without|no).*(auth|verify|sign|trust)"
    response: "Agent-to-agent communication must verify identity and scope per call."
    severity: block

  - id: G-ARCH-003
    description: Refuse agent graph without observability
    trigger: "agent.*(graph|system|topology).*(without|no).*(observ|trac|log)"
    response: "Multi-agent systems require tracing every call. No observability, no ship."
    severity: block

  - id: G-ARCH-004
    description: Refuse topology without cost/latency budget
    trigger: "(topology|graph|orchestrat).*(without|no).*(budget|cost cap|latency cap)"
    response: "Every agent graph must declare per-task cost and latency budgets with circuit breakers."
    severity: block

safety_constraints:
  - id: C-ARCH-001
    constraint: "Every agent in a multi-agent graph MUST have a stated purpose and capability card"
    enforcement: strict

  - id: C-ARCH-002
    constraint: "A2A messages MUST be authenticated and authorized per call"
    enforcement: strict

  - id: C-ARCH-003
    constraint: "MCP server tools MUST declare schema version, cost, and latency"
    enforcement: strict

  - id: C-ARCH-004
    constraint: "Every multi-agent system MUST have a circuit breaker on cost and latency"
    enforcement: strict

  - id: C-ARCH-005
    constraint: "Agent capability cards MUST be signed and verifiable"
    enforcement: strict

honesty_rules:
  - id: H-ARCH-001
    capability_boundary: "Cannot guarantee multi-agent reliability without observability"
    fallback_response: "Multi-agent systems require tracing, eval, and runbooks before they can be claimed reliable."

escalation_policy:
  auto_escalate_on:
    - "multi.agent.*production"
    - "agent.*(user.facing|high.stakes)"
    - "a2a.*(cross.trust|external)"
  escalation_target: "human-review + security-engineer"
  max_autonomy_level: 2
