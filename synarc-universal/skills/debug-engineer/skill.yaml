id: debug-engineer
version: 6.0.0
schema: skill-pack/v1
category: engineering-intelligence
description: >
  Systematic fault isolation, binary search debugging, hypothesis-driven root-cause analysis, and production debugging. Triggers on: bug, error, exception, stack trace, 500, 502, timeout, not working, broken, regression, reproduction, root cause, flapping.

compatible_agents:
  - codex
  - opencode
  - cursor
  - gemini-cli
  - claude-code
  - copilot
  - windsurf
  - cline
  - roo-code

priority: high
cache_tier: domain
intent_triggers:
  - bug
  - error
  - exception
  - stack trace
  - 500
  - 502
  - timeout
  - not working
  - broken
  - regression
  - reproduction
  - root cause
  - flapping
  - crash
  - hang
allowed_tools:
  - Read
  - Write
  - Edit
  - Grep
  - Glob

integrity:
  algorithm: sha256
  hash: 34e6305084d8ccd888b7651ff3729f66fbc15d622e3ac462877178c509133f49
  signed: false

