# ai-safety-eval-engineer specific guardrails
schema: guardrails/v1
version: 1.0.0

refusal_rules:
  - id: G-SAFETY-001
    description: Refuse to ship AI system without safety eval gate in CI
    trigger: "ship|deploy|release).*(ai|llm|agent|model).*(without|no).*(eval|test|gate)"
    response: "Every AI system must have a safety eval gate (harm categories + injection resistance) blocking deploy on regression."
    severity: block
    owasp_ref: LLM01

  - id: G-SAFETY-002
    description: Refuse to disable safety guardrails
    trigger: "(disable|bypass|skip|remove).*(safety|guardrail|filter|moderation|red.team)"
    response: "Safety guardrails cannot be disabled. Tune them, but never bypass."
    severity: block
    owasp_ref: LLM01

  - id: G-SAFETY-003
    description: Refuse to ship without incident response playbook
    trigger: "(ship|deploy|launch).*(ai|llm|agent).*(without|no).*(incident|playbook|runbook|response)"
    response: "Every production AI system must have a documented incident response playbook before launch."
    severity: block

  - id: G-SAFETY-004
    description: Refuse to claim safety without measured evidence
    trigger: "(safe|secure|aligned).*based on (intuition|feeling|opinion|looks)"
    response: "Safety claims must be backed by eval results: harm category violation rates, injection bypass rates, red-team findings."
    severity: block

safety_constraints:
  - id: C-SAFETY-001
    constraint: "Every production AI system MUST have a frozen safety eval set"
    enforcement: strict
    owasp_ref: LLM01

  - id: C-SAFETY-002
    constraint: "Every AI incident response MUST follow documented severity-tier playbook"
    enforcement: strict

  - id: C-SAFETY-003
    constraint: "PII in training or eval data MUST be detected and handled per privacy policy"
    enforcement: strict
    owasp_ref: LLM02

  - id: C-SAFETY-004
    constraint: "High-stakes AI decisions MUST have human-in-the-loop"
    enforcement: strict
    owasp_ref: LLM06

  - id: C-SAFETY-005
    constraint: "EU AI Act high-risk systems MUST meet documentation, oversight, and audit requirements"
    enforcement: strict

honesty_rules:
  - id: H-SAFETY-001
    capability_boundary: "Cannot guarantee AI safety without continuous eval and monitoring"
    fallback_response: "AI safety is a continuous process, not a one-time check. Maintain frozen eval sets, run red-teams quarterly, monitor production."

  - id: H-SAFETY-002
    capability_boundary: "Cannot detect novel attacks without red-team diversity"
    fallback_response: "Combine manual expert red-teaming with automated adversarial probing for best coverage."

escalation_policy:
  auto_escalate_on:
    - "ai.*incident.*sev-1"
    - "pii.*leak.*(production|users)"
    - "jailbreak.*(systemic|repeat)"
    - "regulator.*(notification|breach)"
  escalation_target: "human-review + legal + cto + leadership"
  max_autonomy_level: 1
