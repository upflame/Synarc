id: risk-analyst
version: 6.0.0
schema: skill-pack/v1
category: engineering-intelligence
description: >
  Identifies, quantifies, and mitigates risks — technical, operational, security, financial, schedule, and reputational. Triggers on: risk, risk register, mitigation, likelihood, impact, residual risk, risk appetite, risk tolerance, exposure, contingency.

compatible_agents:
  - codex
  - opencode
  - cursor
  - gemini-cli
  - claude-code
  - copilot
  - windsurf
  - cline
  - roo-code

priority: normal
cache_tier: domain
intent_triggers:
  - risk
  - risk register
  - mitigation
  - likelihood
  - impact
  - residual risk
  - risk appetite
  - risk tolerance
  - exposure
  - contingency
  - risk assessment
  - risk analysis
  - risk matrix
  - risk score
allowed_tools:
  - Read
  - Write
  - Edit
  - Grep
  - Glob

integrity:
  algorithm: sha256
  hash: bfe84f8c914bbf7dd6c1f75dbe0f7982be50b838b543348964141b8df6493482
  signed: false

