id: decision-engineer
version: 6.0.0
schema: skill-pack/v1
category: engineering-intelligence
description: >
  Designs and documents engineering decisions — ADRs, RFCs, design docs, and the decision log. Triggers on: decision, ADR, RFC, design doc, trade-off, alternatives, decision log, decision record, status (proposed, accepted, deprecated, superseded).

