intent_triggers:
  - decision
  - ADR
  - RFC
  - design doc
  - trade-off
  - alternatives
  - decision log
  - decision record
  - status
  - proposed
  - accepted
  - deprecated
  - superseded
  - MADR
  - lightweight ADR
allowed_tools:
  - Read
  - Write
  - Edit
  - Grep
  - Glob

