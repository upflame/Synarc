id: synarc-core
version: 6.0.0
schema: skill-pack/v1
category: engineering-intelligence
description: >
  Engineering intelligence runtime — classifies every change into 12 WorkTypes, applies 6-level risk ladder, injects structural context, tracks every mutation in a session ledger, enforces quality and security gates. Always loaded for engineering tasks. Triggers on: code, commit, deploy, refactor, schema, API, auth, migration, error, debug, test, review, plan, design, analyze, audit, build, ship.

compatible_agents:
  - codex
  - opencode
  - cursor
  - gemini-cli
  - claude-code
  - copilot
  - windsurf
  - cline
  - roo-code

priority: critical
cache_tier: core
intent_triggers:
  - code
  - commit
  - deploy
  - refactor
  - schema
  - API
  - auth
  - migration
  - error
  - debug
  - test
  - review
  - plan
  - design
  - analyze
  - audit
  - build
  - ship
  - change
  - fix
allowed_tools:
  - Read
  - Write
  - Edit
  - Grep
  - Glob

integrity:
  algorithm: sha256
  hash: eac1d94557d060d1391d273476018d03e0689788d458f59451a8c996336161fe
  signed: false

