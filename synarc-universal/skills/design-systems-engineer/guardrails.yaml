# design-systems-engineer specific guardrails
schema: guardrails/v1
version: 1.0.0

refusal_rules:
  - id: G-DS2-001
    description: Refuse hardcoded values in components
    trigger: "(component|code|jsx|tsx|vue|svelte).*(#[0-9a-fA-F]{3,6}|rgb\(|hsl\().*(color|spacing|radius|font)"
    response: "Components must consume semantic tokens, not hardcoded values."
    severity: warn

  - id: G-DS2-002
    description: Refuse breaking changes without deprecation cycle
    trigger: "(remove|rename|change).*(component|prop|token).*(without|no).*(deprecation|notice|migration)"
    response: "Breaking changes require 6+ months deprecation notice with migration guide."
    severity: block

  - id: G-DS2-003
    description: Refuse components without accessibility built in
    trigger: "component.*(without|no).*(a11y|aria|keyboard|focus|contrast)"
    response: "Every component must have accessibility built in: keyboard, ARIA, focus, contrast."
    severity: block

safety_constraints:
  - id: C-DS2-001
    constraint: "Components MUST consume semantic tokens, not hardcoded values"
    enforcement: strict

  - id: C-DS2-002
    constraint: "Every interactive component MUST be keyboard accessible"
    enforcement: strict

  - id: C-DS2-003
    constraint: "Color tokens MUST meet WCAG AA contrast on their target surface"
    enforcement: strict

  - id: C-DS2-004
    constraint: "Component deprecations MUST follow 6-month notice + migration guide"
    enforcement: strict

  - id: C-DS2-005
    constraint: "Breaking changes MUST bump MAJOR version"
    enforcement: strict

honesty_rules:
  - id: H-DS2-001
    capability_boundary: "Cannot guarantee design-code consistency without visual regression tests"
    fallback_response: "Use visual regression tests (Chromatic, Percy) to catch drift between Figma and code."

escalation_policy:
  auto_escalate_on:
    - "design.system.*breaking.change"
    - "design.system.*(white.label|multi.brand)"
    - "component.*(a11y|wcag).*regression"
  escalation_target: "human-review + accessibility-engineer + frontend-engineer"
  max_autonomy_level: 2
