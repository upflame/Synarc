id: change-intelligence
version: 6.0.0
schema: skill-pack/v1
category: engineering-intelligence
description: >
  Classifies engineering changes, assesses risk, maps impact, and decides the right depth of review, testing, and rollout. Triggers on: change, classification, impact, risk, change request, RFC, blast radius, dependency, migration, breaking change.

compatible_agents:
  - codex
  - opencode
  - cursor
  - gemini-cli
  - claude-code
  - copilot
  - windsurf
  - cline
  - roo-code

priority: high
cache_tier: core
intent_triggers:
  - change
  - classification
  - impact
  - risk
  - change request
  - RFC
  - blast radius
  - dependency
  - migration
  - breaking change
  - change type
  - change risk
  - change review
  - change advisory
allowed_tools:
  - Read
  - Write
  - Edit
  - Grep
  - Glob

integrity:
  algorithm: sha256
  hash: 309a0f6c497258236e09bc2c585d6756d279441adccc2d781139166a52e25c28
  signed: false

