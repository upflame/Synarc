id: change-intelligence
version: 4.0.0
schema: skill-pack/v1
category: engineering-intelligence
description: >
  Comprehensive seven-dimensional change classification, composite risk scoring, multi-surface diff analysis, cross-boundary impact detection, safe-to-merge evaluation gates, code review intelligence with actionable feedback patterns, change audit ledger, and review quality gates. Merges change-taxonomy, analysis-patterns, and review-engineer into a unified discipline.

compatible_agents:
  - codex
  - opencode
  - cursor
  - gemini-cli
  - claude-code
  - copilot
  - windsurf
  - cline
  - roo-code

activation:
  type: intent-based
  description: Activates when user requests domain-specific engineering guidance

dependencies:
  synarc-core: ">=5.0.0"

integrity:
  algorithm: sha256
  hash: e035871f825f038ef70a696873f47744887237621881f9bd9508527a61f32685
  signed: false

