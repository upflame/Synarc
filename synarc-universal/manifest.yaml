pack:
  id: synarc-universal
  name: Synarc Universal - Autonomous Engineering Intelligence Runtime
  description: >
    Universal agent skill pack for engineering cognition - change classification, risk
    assessment, context injection, session tracking, quality gates, error intelligence.
    Compatible with all major AI coding agents (Codex, OpenCode, Cursor, Gemini CLI,
    Claude Code, Copilot, Windsurf, Cline, RooCode). v6.0.0 introduces the
    4-tier prompt-caching architecture, intent-based activation via intent_triggers,
    and 35x token reduction versus v5.x.
  version: 6.0.0
  schema: skill-pack/v1
  author: UpFlame Labs <info@upflame.in>

  compatible_agents:
    - codex
    - opencode
    - cursor
    - gemini-cli
    - claude-code
    - copilot
    - windsurf
    - cline
    - roo-code

  tags:
    - engineering-intelligence
    - autonomous-cognition
    - architecture-analysis
    - change-intelligence
    - deployment-safety
    - risk-management
    - quality-gates
    - session-tracking
    - cross-platform
    - universal-runtime
    - prompt-caching
    - token-efficient

  categories:
    - engineering-intelligence
    - architecture
    - development
    - security
    - devops
    - data
    - mobile
    - ml
    - leadership

