name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly stress at 03:00 UTC
    - cron: "0 3 * * *"

jobs:
  unit:
    name: Unit + Matrix (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci || npm install
        working-directory: synarc-universal
      - name: Smoke + SDK tests
        run: npm run test:smoke
        working-directory: synarc-universal
      - name: SDK tests
        run: npm run test:sdk
        working-directory: synarc-universal
      - name: Matrix tests (1000+ cases)
        run: npm run test:matrix
        working-directory: synarc-universal

  matrix-stress:
    name: Matrix stress (nightly)
    runs-on: ubuntu-latest
    needs: unit
    if: github.event_name == 'schedule' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci || npm install
        working-directory: synarc-universal
      - name: Run matrix 3x
        run: |
          for i in 1 2 3; do
            echo "=== Run $i ==="
            npm run test:matrix
          done
        working-directory: synarc-universal
      - name: Upload matrix.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-results
          path: synarc-universal/test-results/matrix.json
